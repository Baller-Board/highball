# Runs on every push and pull request. Two checks:
#   build  - the site compiles (the same build Vercel runs)
#   rules  - every database migration applies, and the 41 permission
#            checks pass (planters can't verify their own days, etc.)
# A red X on GitHub means one of these failed; click it to see which.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: setup_all.sql is up to date with the migrations
        run: |
          ./scripts/build-setup.sh
          git diff --exit-code supabase/setup_all.sql || {
            echo "::error::Run ./scripts/build-setup.sh and commit supabase/setup_all.sql"; exit 1; }
      - run: ./scripts/test-db.sh
